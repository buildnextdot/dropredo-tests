applications:
  dropredo-website:
    groups:
      homepage:
        description: The homepage hero, its CTAs, and the pricing teaser / FAQ sections further down the page.
        tests:
          homepage hero shows the primary message and both CTAs go to the right places:
            environments: [prod]
            steps:
              - step: visit {{ base_uri }}
                assertions:
                  - the heading "Your UI changed." is visible
                  - description: the "Start free — no code, no card" button has the href pointing at the DropRedo app
                    type: elementHasAttribute
                    attribute: href
                    expected: "{{ app_url }}"
              - step: click "Watch a test heal itself (90s)"
                assertions:
                  - 'the heading "Self-healing tests: what it actually means" is visible'
                  - the URL contains /self-healing-tests

          homepage shows a pricing teaser and FAQ section:
            environments: [prod]
            steps:
              - step: visit {{ base_uri }}
                assertions:
                  - the heading "Frequently Asked Questions" is visible
                  - the "Free" plan is visible in the pricing teaser
              - step: click the FAQ question "What is DropRedo?"
                assertions:
                  - an answer is visible below the "What is DropRedo?" question
              - step: click "See full pricing & overages"
                assertions:
                  - 'the heading "Simple pricing, generous free tier" is visible'
                  - the URL contains /pricing
